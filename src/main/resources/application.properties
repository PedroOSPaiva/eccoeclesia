spring.application.name=EcoEcclesia
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.access-token-validity=PT15M
security.jwt.refresh-token-validity=PT7D

# Default administrative user provisioning (can be overridden per environment)
app.admin.enabled=${APP_ADMIN_ENABLED:false}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.roles=${APP_ADMIN_ROLES:TREASURER}
